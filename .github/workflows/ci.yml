name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Python
        run: python -m py_compile widget.py
      - name: Validate shell scripts
        run: shellcheck run.sh stop.sh install-autostart.sh
